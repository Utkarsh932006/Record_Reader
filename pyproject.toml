[project]
name = "record-reader"
version = "0.1.0"
description = "This is a tool for reading and analyzing ISP record data."
readme = "README.md"
authors = [
    { name = "Utkarsh Mishra", email = "utkarsh932006@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fuzzywuzzy>=0.18.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-Levenshtein>=0.25.0",
    "xlsxwriter>=3.2.0",
]

[project.scripts]
record-reader = "record_reader:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
